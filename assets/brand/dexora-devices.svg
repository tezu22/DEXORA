<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Máy tính desktop và laptop DEXORA</title><desc id="desc">Minh họa PC màu tối với quạt neon xanh và laptop màn hình xanh cyan</desc>
