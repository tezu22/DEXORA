name: DEXORA | Validate, update prices and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 00:00 and 12:00 UTC; GitHub may delay scheduled jobs.
    - cron: '0 0,12 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.rev.outputs.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and price dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-prices.txt
      - name: Validate content and price parsing
        run: python -m pytest -q tests/test_update_prices.py tests/test_price_variants.py tests/test_site_contract.py
      - name: Check JavaScript syntax
        run: |
          for src in assets/js/*.js data/catalog.js; do node --check "$src"; done
      - name: Refresh prices (only scheduled or manually triggered)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          cp data/prices.json /tmp/dexora-prices-before-update.json
          python scripts/update_prices.py
          python -m pytest -q tests/test_update_prices.py tests/test_price_variants.py tests/test_site_contract.py
          if ! cmp -s /tmp/dexora-prices-before-update.json data/prices.json; then
            cp /tmp/dexora-prices-before-update.json data/prices.backup.json
          fi
      - name: Commit a validated price snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'DEXORA Price Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prices.json data/prices.backup.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh validated public price snapshots [skip ci]'
            git push origin HEAD:main
          fi
      - name: Record source revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package static web
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
